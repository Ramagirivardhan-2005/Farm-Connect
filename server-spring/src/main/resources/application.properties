# ------------------------------------------------------------------------------
# Level 2: Redis Caching (Instruction 20-21)
# ------------------------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000
farmconnect.redis.enabled=false

# ------------------------------------------------------------------------------
# Level 2: RabbitMQ (Instruction 22-26)
# ------------------------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
farmconnect.rabbitmq.enabled=false

# ------------------------------------------------------------------------------
# Level 2: Resilience4j Fault Tolerance
# ------------------------------------------------------------------------------
resilience4j.circuitbreaker.instances.razorpay.sliding-window-size=10
resilience4j.circuitbreaker.instances.razorpay.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.razorpay.wait-duration-in-open-state=10000
resilience4j.retry.instances.razorpay.max-attempts=3
resilience4j.retry.instances.razorpay.wait-duration=1000
resilience4j.retry.instances.mailSender.max-attempts=3
resilience4j.retry.instances.mailSender.wait-duration=2000

# ------------------------------------------------------------------------------
# Level 2: Actuator & Prometheus Observability (Instruction 38, 43)
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=false
management.health.mail.enabled=false
management.health.rabbit.enabled=false
management.health.mongo.enabled=false
management.metrics.tags.application=${spring.application.name}

# ------------------------------------------------------------------------------
# OpenAPI / Swagger Documentation
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
