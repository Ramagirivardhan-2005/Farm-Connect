# ==============================================================================
# FARMCONNECT SPRING BOOT APPLICATION CONFIGURATION
# ==============================================================================
spring.application.name=farmconnect-backend
server.port=5000

# Servlet & Multipart settings
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ------------------------------------------------------------------------------
# MySQL 8 Database Configuration
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/farmconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Vardhan@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pooling (Instruction 37)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=FarmConnectHikariCP

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false

# Flyway Migrations (Instruction 3)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# ------------------------------------------------------------------------------
# Security & JWT Configuration (15 Minutes Expiry - Instruction 5)
# ------------------------------------------------------------------------------
jwt.secret=super_secure_access_token_secret_min_32_chars_long_1234
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

